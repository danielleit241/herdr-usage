# herdr-usage: shows Claude Code and Codex subscription usage (5h / weekly %)
# in the herdr agents sidebar through the `$usage` pane token.
#
# The agents drive refresh themselves (Claude statusLine, Codex Stop hook,
# wired by the `install-hooks` action). Herdr hooks add an immediate refresh
# when an agent appears, on linux/macos only: on Windows 11 every console
# process started from a herdr hook flashes a Windows Terminal window.

id = "herdr-usage"
name = "herdr-usage"
version = "0.2.1"
description = "AI agent subscription usage (5h / weekly) in the agents sidebar, one row per provider (Claude Code, Codex)."
min_herdr_version = "0.9.0"
platforms = ["linux", "macos", "windows"]

# No dependencies to install: only fail early when Node.js is missing or too old.
[[build]]
command = ["node", "-e", "if (+process.versions.node.split('.')[0] < 18) { console.error('herdr-usage needs Node.js 18+, found ' + process.version); process.exit(1) }"]

[[startup]]
platforms = ["linux", "macos"]
command = ["node", "src/cli.js", "publish"]

[[events]]
on = "pane.agent_detected"
platforms = ["linux", "macos"]
command = ["node", "src/cli.js", "publish"]

[[actions]]
id = "refresh"
title = "Refresh usage"
description = "Read the usage of every provider now and update the agents sidebar."
contexts = ["global"]
command = ["node", "src/cli.js", "publish"]

[[actions]]
id = "install-hooks"
title = "Install usage hooks"
description = "Add the refresh hook of every installed provider tool (Claude Code statusLine, Codex Stop hook); backs up each file."
contexts = ["global"]
command = ["node", "src/cli.js", "install"]

[[actions]]
id = "uninstall-hooks"
title = "Uninstall usage hooks"
description = "Remove the refresh hooks of every provider. Run before `herdr plugin uninstall`."
contexts = ["global"]
command = ["node", "src/cli.js", "uninstall"]

[[actions]]
id = "install-font"
title = "Install logo font"
description = "Install the provider logo font for the current user (for the $herdr_usage_icon token)."
contexts = ["global"]
command = ["node", "src/cli.js", "install-font"]

[[actions]]
id = "uninstall-font"
title = "Uninstall logo font"
description = "Remove the logo font installed by install-font."
contexts = ["global"]
command = ["node", "src/cli.js", "uninstall-font"]
